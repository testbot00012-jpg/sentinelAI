services:
  # FastAPI Backend Web Service
  - type: web
    name: sentinel-backend
    env: python
    region: ohio
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: sentinel-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: "sentinelai-9d573"

  # Redis Instance
  - type: redis
    name: sentinel-redis
    region: ohio
    plan: free
